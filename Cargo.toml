[package]
name = "dripwriter"
version = "0.1.0"
edition = "2021"
description = "A local, OS-level text dripper for Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true