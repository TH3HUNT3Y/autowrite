name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows executable
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Windows artifact
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/auto_write.exe auto_write-windows-x86_64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_write-windows
          path: auto_write-windows-x86_64.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: auto_write-windows

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            auto_write-windows-x86_64.exe
          generate_release_notes: true